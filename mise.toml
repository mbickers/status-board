[settings]
task.source_freshness_hash_contents = true

[tools]
opam = "2.5.2"
protoc = "36.0"
watchexec = "2.5.1"

[tasks.bootstrap]
sources = ["mise.toml"]
outputs = ["_opam/.opam-switch/switch-config"]
run = '''
main_worktree=$(cd "$(git rev-parse --git-common-dir)/.." && pwd)
if [ "$main_worktree" = "$PWD" ]; then
  test -e _opam || opam switch create . 5.1.1 --no-install --yes --repositories=default=https://opam.ocaml.org
else
  test -e _opam || opam switch link "$main_worktree" .
  # dune roots at the outermost dune-workspace, so without one here it would
  # build and analyze the main checkout instead of this worktree
  echo "(lang dune 3.12)" > dune-workspace
fi
'''

[tasks.deps]
depends = ["bootstrap"]
sources = ["*.opam", "*.opam.locked"]
outputs = ["_opam/.deps_installed"]
run = '''
main_worktree=$(cd "$(git rev-parse --git-common-dir)/.." && pwd)
if [ "$main_worktree" != "$PWD" ] \
  && ! diff -q "$main_worktree/status_board.opam.locked" status_board.opam.locked >/dev/null
then
  echo "Refusing to install: this worktree shares the opam switch in $main_worktree," >&2
  echo "so installing here would change packages for every worktree. Change" >&2
  echo "dependencies in $main_worktree, or give this worktree its own switch with" >&2
  echo "  rm _opam && opam switch create . 5.1.1 --no-install" >&2
  exit 1
fi
opam install . --deps-only --locked --with-dev-setup --yes \
  && touch _opam/.deps_installed
'''

[tasks.schemas]
hide = true
sources = ["server/mta_protobuf/schemas.lock"]
outputs = [
  "server/mta_protobuf/gtfs-realtime.proto",
  "server/mta_protobuf/gtfs-realtime-NYCT.proto",
]
run = '''
while read -r sha256 url output; do
  mkdir -p "$(dirname "$output")"
  curl --fail --location --output "$output.tmp" "$url"
  echo "$sha256  $output.tmp" | shasum --algorithm 256 --check
  mv "$output.tmp" "$output"
done < server/mta_protobuf/schemas.lock
'''

[tasks.lock]
run = "opam lock ."

[tasks.format]
depends = ["deps"]
run = '''find server -type f \( -name '*.ml' -o -name '*.mli' \) ! -path 'server/mta_protobuf/*' -exec opam exec -- ocamlformat --inplace {} +'''

[tasks.pre-commit]
depends = ["deps"]
run = '''find server -type f \( -name '*.ml' -o -name '*.mli' \) ! -path 'server/mta_protobuf/*' -exec opam exec -- ocamlformat --check {} +'''

[tasks.build]
depends = ["deps", "schemas"]
run = "opam exec -- dune build server/bin/main.exe"

[tasks."prod-deps"]
hide = true
depends = ["bootstrap"]
sources = ["*.opam", "*.opam.locked"]
outputs = ["_opam/.prod_deps_installed"]
run = "opam install . --deps-only --locked --yes && touch _opam/.prod_deps_installed"

[tasks.prod-install]
depends = ["prod-deps", "schemas"]
run = '''
test "$PWD" = "$HOME/status-board" || {
  echo "prod-install must run from $HOME/status-board" >&2
  exit 1
}
opam exec -- dune build --profile release server/bin/main.exe
install -D -m 755 _build/default/server/bin/main.exe "$HOME/.local/bin/status-board.new"
mv "$HOME/.local/bin/status-board.new" "$HOME/.local/bin/status-board"
install -D -m 644 status-board.service "$HOME/.config/systemd/user/status-board.service"
install -d "$HOME/.local/state/status-board/cache"
systemctl --user daemon-reload
systemctl --user enable status-board.service
systemctl --user restart status-board.service
systemctl --user is-active --quiet status-board.service
'''

[tasks."build:watch"]
depends = ["deps", "schemas"]
run = "opam exec -- dune build --watch server/bin/main.exe"

[tasks.test]
depends = ["deps", "schemas"]
run = "opam exec -- dune build server/bin/main.exe @runtest"

[tasks."test:watch"]
depends = ["deps", "schemas"]
run = "opam exec -- dune build --watch server/bin/main.exe @runtest"

[tasks.dev]
depends = ["dev:server", "dev:test"]

[tasks."dev:prepare"]
depends = ["deps", "schemas"]
sources = ["server/**/*.ml", "server/**/*.mli", "server/**/*.proto", "server/**/*.html", "server/**/dune", "server/mta_protobuf/schemas.lock", "dune-project"]
outputs = ["_build/default/server/bin/main.exe", "_build/server_tests_passed"]
run = "opam exec -- dune build server/bin/main.exe @runtest && touch _build/server_tests_passed"

[tasks."dev:server"]
depends = ["dev:prepare"]
run = "opam exec -- watchexec --restart --watch _build/server_tests_passed -- _build/default/server/bin/main.exe -cache-path _cache -port 8080"

[tasks."dev:test"]
depends = ["dev:prepare"]
run = '''
opam exec -- watchexec \
  --restart \
  --postpone \
  --watch server \
  --watch dune-project \
  --watch status_board.opam \
  -- "opam exec -- dune build server/bin/main.exe @runtest && touch _build/server_tests_passed"
'''
