[settings]
task.source_freshness_hash_contents = true

[tools]
opam = "2.1.5"
protoc = "36.0"
watchexec = "2.5.1"

[tasks.bootstrap]
sources = ["mise.toml"]
outputs = ["_opam/.opam-switch/switch-config"]
run = "test -d _opam || opam switch create . 5.1.1 --no-install --yes --repositories=default=https://opam.ocaml.org"

[tasks.deps]
depends = ["bootstrap"]
sources = ["*.opam", "*.opam.locked"]
outputs = ["_opam/.deps_installed"]
run = "opam install . --deps-only --locked --yes && touch _opam/.deps_installed"

[tasks.schemas]
hide = true
sources = ["server/mta_protobuf/schemas.lock"]
outputs = [
  "server/mta_protobuf/com/google/transit/realtime/gtfs-realtime.proto",
  "server/mta_protobuf/com/google/transit/realtime/gtfs-realtime-NYCT.proto",
]
run = '''
while read -r sha256 url output; do
  mkdir -p "$(dirname "$output")"
  curl --fail --location --output "$output.tmp" "$url"
  echo "$sha256  $output.tmp" | shasum --algorithm 256 --check
  mv "$output.tmp" "$output"
done < server/mta_protobuf/schemas.lock
'''

[tasks.lock]
run = "opam lock ."

[tasks.format]
depends = ["deps"]
run = '''find server -type f \( -name '*.ml' -o -name '*.mli' \) ! -path 'server/mta_protobuf/*' -exec opam exec -- ocamlformat --inplace {} +'''

[tasks.pre-commit]
depends = ["deps"]
run = '''find server -type f \( -name '*.ml' -o -name '*.mli' \) ! -path 'server/mta_protobuf/*' -exec opam exec -- ocamlformat --check {} +'''

[tasks.build]
depends = ["deps", "schemas"]
run = "opam exec -- dune build server/bin/main.exe"

[tasks."build:watch"]
depends = ["deps", "schemas"]
run = "opam exec -- dune build --watch server/bin/main.exe"

[tasks.test]
depends = ["deps", "schemas"]
run = "opam exec -- dune build server/bin/main.exe @runtest"

[tasks."test:watch"]
depends = ["deps", "schemas"]
run = "opam exec -- dune build --watch server/bin/main.exe @runtest"

[tasks.dev]
depends = ["dev:server", "dev:test"]

[tasks."dev:prepare"]
depends = ["deps", "schemas"]
sources = ["server/**/*.ml", "server/**/*.mli", "server/**/*.proto", "server/**/*.html", "server/**/dune", "server/mta_protobuf/schemas.lock", "dune-project"]
outputs = ["_build/default/server/bin/main.exe", "_build/server_tests_passed"]
run = "opam exec -- dune build server/bin/main.exe @runtest && touch _build/server_tests_passed"

[tasks."dev:server"]
depends = ["dev:prepare"]
run = "opam exec -- watchexec --restart --watch _build/server_tests_passed -- _build/default/server/bin/main.exe -cache-path _cache -port 8080"

[tasks."dev:test"]
depends = ["dev:prepare"]
run = '''
opam exec -- watchexec \
  --restart \
  --postpone \
  --watch server \
  --watch dune-project \
  --watch status_board.opam \
  -- "opam exec -- dune build server/bin/main.exe @runtest && touch _build/server_tests_passed"
'''
