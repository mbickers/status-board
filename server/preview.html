<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    .display { border: 1px solid #888; image-rendering: pixelated; }
    dt { font-weight: 600; margin-top: 1rem; }
    dd { margin-left: 0; }
  </style>
</head>
<body>
  <form method="get">
    <label for="preset">Debug preset</label>
    <select id="preset" name="preset" onchange="this.form.submit()">
      <option value=""{{#no_debug_preset_selected}} selected{{/no_debug_preset_selected}}>None</option>
      {{#debug_presets}}
      <option value="{{name}}"{{#selected}} selected{{/selected}}>{{name}}</option>
      {{/debug_presets}}
    </select>
  </form>
  <img
    class="display"
    src="{{image_url}}"
    width="{{display_width_px}}"
    height="{{display_height_px}}"
    alt="Rendered screen preview">
  <dl>
    <dt>Time until refresh</dt><dd>{{refresh_seconds}} seconds</dd>
    <dt>Display resolution</dt><dd>{{display_width_px}} × {{display_height_px}} pixels</dd>
  </dl>
  <script>
    setTimeout(() => window.location.reload(), {{refresh_milliseconds}});
    {{{autoreload_script}}}
  </script>
</body>
</html>
