<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    .presets { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
    .presets [aria-current="page"] { font-weight: bold; }
    .display { border: 1px solid #888; image-rendering: pixelated; }
  </style>
</head>
<body>
  <nav class="presets" aria-label="Debug presets">
    <a href="{{default_url}}"{{#default_selected}} aria-current="page"{{/default_selected}}>default</a>
    {{#debug_presets}}
    <a href="{{url}}"{{#selected}} aria-current="page"{{/selected}}>{{name}}</a>
    {{/debug_presets}}
  </nav>
  <img
    class="display"
    src="{{image_url}}"
    alt="Rendered screen preview">
  <script>
    {{{autoreload_script}}}
  </script>
</body>
</html>
